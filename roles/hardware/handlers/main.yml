---
- name: Restart network stack and cycle wifi
  ansible.builtin.shell: |
    set -euo pipefail
    systemctl restart NetworkManager
    nmcli radio wifi off
    nmcli radio wifi on
    sleep 5
  changed_when: true
  become: true

- name: Regenerate initramfs and Limine entries
  ansible.builtin.command: limine-mkinitcpio
  changed_when: true
  become: true
