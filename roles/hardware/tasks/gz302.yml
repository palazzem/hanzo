---
# ASUS ROG Flow Z13 (GZ302) hardware fixes.

- name: Install ASUS packages
  community.general.pacman:
    name: "{{ hardware_asus_pacman }}"
  become: true

- name: Enable and start ASUS services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop: "{{ hardware_asus_services }}"
  when:
    - not ansible_check_mode
    - host_has_systemd
  become: true

- name: Deploy GPU modprobe config
  ansible.builtin.template:
    src: amdgpu.conf.j2
    dest: /etc/modprobe.d/amdgpu.conf
    mode: "0644"
  become: true

- name: Deploy suspend/resume hook
  ansible.builtin.template:
    src: gz302-suspend.sh.j2
    dest: /usr/lib/systemd/system-sleep/gz302-suspend.sh
    mode: "0755"
  become: true

- name: Create XKB override directories
  ansible.builtin.file:
    path: "/etc/xkb/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - rules
    - symbols
  become: true

- name: Deploy XKB rules override
  ansible.builtin.copy:
    src: xkb/rules/evdev
    dest: /etc/xkb/rules/evdev
    mode: "0644"
  become: true

- name: Deploy Copilot key XKB symbols
  ansible.builtin.copy:
    src: xkb/symbols/gz302
    dest: /etc/xkb/symbols/gz302
    mode: "0644"
  become: true
