---
# ASUS ROG Flow Z13 (GZ302) hardware fixes.

- name: Install ASUS packages
  community.general.pacman:
    name: "{{ hardware_asus_pacman }}"
  become: true

- name: Enable and start ASUS services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop: "{{ hardware_asus_services }}"
  when:
    - not ansible_check_mode
    - host_has_systemd
  become: true

- name: Deploy GPU modprobe config
  ansible.builtin.template:
    src: amdgpu.conf.j2
    dest: /etc/modprobe.d/amdgpu.conf
    mode: "0644"
  become: true

- name: Deploy suspend/resume hook
  ansible.builtin.template:
    src: gz302-suspend.sh.j2
    dest: /usr/lib/systemd/system-sleep/gz302-suspend.sh
    mode: "0755"
  become: true

- name: Install GZ302 packages
  community.general.pacman:
    name: "{{ hardware_gz302_pacman }}"
  become: true

- name: Deploy keyd config
  ansible.builtin.template:
    src: keyd-default.conf.j2
    dest: /etc/keyd/default.conf
    mode: "0644"
  become: true
  notify: Restart keyd

- name: Enable and start keyd
  ansible.builtin.systemd_service:
    name: keyd
    state: started
    enabled: true
  when:
    - not ansible_check_mode
    - host_has_systemd
  become: true
