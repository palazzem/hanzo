---
# ASUS ROG Flow Z13 (GZ302) hardware fixes.

- name: Install ASUS packages
  community.general.pacman:
    name: "{{ hardware_asus_pacman }}"
  become: true

- name: Enable and start ASUS services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop: "{{ hardware_asus_services }}"
  when:
    - not ansible_check_mode
    - host_has_systemd
  become: true

- name: Deploy hibernate C-state workaround hook
  ansible.builtin.copy:
    src: hibernate-cstate
    dest: /usr/lib/systemd/system-sleep/hibernate-cstate
    mode: "0755"
  become: true

- name: Create XKB override directories
  ansible.builtin.file:
    path: "/etc/xkb/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - rules
    - symbols
  become: true

- name: Deploy XKB rules override
  ansible.builtin.copy:
    src: xkb/rules/evdev
    dest: /etc/xkb/rules/evdev
    mode: "0644"
  become: true

- name: Deploy Copilot key XKB symbols
  ansible.builtin.copy:
    src: xkb/symbols/gz302
    dest: /etc/xkb/symbols/gz302
    mode: "0644"
  become: true

- name: Deploy Chrome flags enabling VA-API on Strix Halo
  ansible.builtin.copy:
    dest: "{{ ansible_facts.env.HOME }}/.config/chrome-flags.conf"
    content: |
      # Managed by Hanzo. Do not edit manually.
      # Chromium driver-bug entry 475 disables VA-API on the Radeon 8060S
      # (1002:1586) because of an amdgpu SMU deadlock fixed in kernel 7.1.
      # Skipping the workaround list restores hardware video decode.
      # Requires kernel >= 7.1; drop once Chromium removes the entry.
      # https://github.com/palazzem/hanzo/issues/357
      --disable-gpu-driver-bug-workarounds
      --enable-features=AcceleratedVideoEncoder
    mode: "0644"
  become: false
