---
# ASUS ROG Flow Z13 (GZ302) hardware fixes.

# Wifi-powersave fix runs first and is flushed immediately so the
# MT7925 stops dropping long-running TCP transfers before any role
# downloads anything (paru/curl in later roles, pacman in this one).
- name: Deploy NetworkManager wifi powersave drop-in
  ansible.builtin.template:
    src: wifi-powersave.conf.j2
    dest: /etc/NetworkManager/conf.d/wifi-powersave.conf
    mode: "0644"
  become: true
  notify: Restart network stack

- name: Apply wifi powersave before continuing
  ansible.builtin.meta: flush_handlers

- name: Install ASUS packages
  community.general.pacman:
    name: "{{ hardware_asus_packages }}"
  become: true

# asusctl ships without /etc/asusd, but asusd.service's namespace
# directives reference it — the unit fails with status=226/NAMESPACE
# on first start unless the directory exists.
- name: Ensure /etc/asusd exists for asusd.service
  ansible.builtin.file:
    path: /etc/asusd
    state: directory
    mode: "0755"
  become: true

- name: Detect running systemd
  ansible.builtin.stat:
    path: /run/systemd/system
  register: hardware_systemd_running
  check_mode: false
  become: false

- name: Enable and start ASUS services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop: "{{ hardware_asus_services }}"
  when:
    - not ansible_check_mode
    - hardware_systemd_running.stat.exists
  become: true

- name: Deploy GPU modprobe config
  ansible.builtin.template:
    src: amdgpu.conf.j2
    dest: /etc/modprobe.d/amdgpu.conf
    mode: "0644"
  become: true
  notify: Regenerate initramfs

- name: Ensure OLED kernel param in Limine cmdline
  ansible.builtin.lineinfile:
    path: /etc/default/limine
    regexp: '^KERNEL_CMDLINE\[default\]\+=" amdgpu\.dcdebugmask='
    line: 'KERNEL_CMDLINE[default]+=" {{ hardware_gz302_oled_kernel_param }}"'
  become: true
  notify: Regenerate initramfs

- name: Deploy suspend/resume hook
  ansible.builtin.template:
    src: gz302-suspend.sh.j2
    dest: /usr/lib/systemd/system-sleep/gz302-suspend.sh
    mode: "0755"
  become: true

# Hibernation backing store. Single contiguous swap file on a dedicated
# NOCOW subvolume (CachyOS recommended layout). The kernel reads the
# image back via a direct device offset systemd records in the
# HibernateLocation EFI variable, so no resume= cmdline param is needed.
- name: Ensure /swap btrfs subvolume exists
  ansible.builtin.command:
    cmd: btrfs subvolume create /swap
    creates: /swap
  become: true

- name: Ensure /swap/swapfile exists
  ansible.builtin.command:
    cmd: btrfs filesystem mkswapfile --size {{ hardware_gz302_swap_size }} --uuid clear /swap/swapfile
    creates: /swap/swapfile
  become: true

- name: Register swap in /etc/fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    line: "/swap/swapfile none swap defaults 0 0"
    regexp: '^/swap/swapfile\s'
    state: present
  become: true

# swapon --all activates everything in /etc/fstab and silently skips
# devices already in use, so the task is idempotent without a pre-check.
- name: Activate swap from fstab
  ansible.builtin.command: swapon --all
  changed_when: false
  become: true

# systemd-suspend-then-hibernate.service consults HibernateDelaySec at
# invocation time, so no service restart is needed for this drop-in to
# take effect on the next sleep operation.
- name: Configure systemd hibernate delay
  ansible.builtin.copy:
    dest: /etc/systemd/sleep.conf.d/10-hibernate-delay.conf
    content: |
      # Managed by Hanzo. Do not edit manually.
      [Sleep]
      HibernateDelaySec={{ hardware_gz302_hibernate_delay_sec }}
    owner: root
    group: root
    mode: "0644"
  become: true

# Under KDE, PowerDevil holds a block-mode inhibitor on handle-lid-switch
# and these settings are inert. They apply only when no inhibitor is held —
# TTY-only boots, recovery shells, and non-KDE desktop sessions.
- name: Configure logind lid handler as non-KDE fallback
  ansible.builtin.copy:
    dest: /etc/systemd/logind.conf.d/10-hibernate.conf
    content: |
      # Managed by Hanzo. Do not edit manually.
      [Login]
      HandleLidSwitch=suspend-then-hibernate
      HandleLidSwitchExternalPower=suspend-then-hibernate
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Reload logind

# KDE Plasma 6: PowerDevil writes lid-action behavior here. SleepMode=3
# = "Suspend then Hibernate" — set under both AC and Battery so behavior
# is consistent regardless of power source.
- name: Configure KDE PowerDevil sleep mode
  ansible.builtin.copy:
    dest: "{{ ansible_facts.env.HOME }}/.config/powerdevilrc"
    content: |
      # Managed by Hanzo. Do not edit manually.
      [AC][SuspendAndShutdown]
      SleepMode=3

      [Battery][SuspendAndShutdown]
      SleepMode=3
    mode: "0644"
  become: false

- name: Install keyd
  community.general.pacman:
    name: keyd
  become: true

- name: Deploy keyd config
  ansible.builtin.template:
    src: keyd-default.conf.j2
    dest: /etc/keyd/default.conf
    mode: "0644"
  become: true
  notify: Restart keyd

- name: Enable and start keyd
  ansible.builtin.systemd_service:
    name: keyd
    state: started
    enabled: true
  when:
    - not ansible_check_mode
    - hardware_systemd_running.stat.exists
  become: true
