---
hardware_asus_packages:
  - asusctl
  - rog-control-center

hardware_asus_services:
  - asusd

# Disable Panel Replay (DC_DISABLE_REPLAY=0x400) and PSR-SU
# (DC_DISABLE_PSR_SU=0x200) on the Strix Halo OLED panel to prevent
# scrolling artifacts and flicker on DCN 3.5.
hardware_gz302_oled_kernel_param: "amdgpu.dcdebugmask=0x600"

# Force ABM off: kernel auto-skip on OLED was reverted in 2024; PPD engages
# ABM on battery and causes visible gamma/red-shift on AMD OLED panels.
hardware_gz302_amdgpu_abmlevel: 0
# Disable scatter-gather display to prevent flicker on unified-memory APUs under memory pressure.
hardware_gz302_amdgpu_sg_display: 0
# Disable Compute Wavefront Save-Restore to prevent GPU hangs on RDNA 3.5.
hardware_gz302_amdgpu_cwsr_enable: 0

# ASUS USB identifiers for keyboard, touchpad, and lightbar devices.
hardware_gz302_asus_usb_vendor: "0b05"
hardware_gz302_asus_keyboard_product: "1a30"
hardware_gz302_asus_lightbar_product: "18c6"

# NetworkManager wifi.powersave for MT7925. NM's default (3 = enabled)
# causes disconnects and throttled throughput on this chip; 2 = disabled is
# the cross-distro workaround (Arch, Fedora, Framework, Z13 communities).
# Trade-off: ~1-2% extra system idle power; does NOT affect suspend (the
# mt7925_pci_suspend driver callback is a separate code path from runtime
# nl80211 PS). 1 = ignore is not a substitute because the mt76 driver
# default is PS-on (the 2023 patch to flip it was rejected upstream).
# Flip back to 3 if a future kernel/firmware combo fixes the regression.
# Values: 0 = use default, 1 = ignore, 2 = disable, 3 = enable.
hardware_gz302_wifi_powersave: 2

# Hibernation backing swap. BTRFS swap files require a NOCOW subvolume
# with no compression; `btrfs filesystem mkswapfile` enforces both. Size
# = detected RAM (memtotal_mb) rounded up to GB + 4 GB headroom for the
# image header. memtotal_mb is the kernel-visible total, which is already
# net of amdgpu's VRAM carveout on Strix Halo.
hardware_gz302_swap_size: "{{ ((ansible_facts['memtotal_mb'] / 1024) | round(0, 'ceil') | int + 4) }}g"

# HibernateDelaySec for systemd-suspend-then-hibernate.service: time in
# s2idle before transitioning to hibernate. 1800s = 30 min trades a small
# battery cost (suspend draws ~1-2 %/h on Strix Halo) for fast resume on
# short lid-close intervals.
hardware_gz302_hibernate_delay_sec: 1800

# KDE PowerDevil SleepMode enum (Plasma 6 powerdevilrc, [Profile][SuspendAndShutdown]).
# Required because PowerDevil holds a block-mode inhibitor on
# handle-lid-switch, making /etc/systemd/logind.conf.d/ inert under KDE.
# Values: 1 = Suspend, 2 = Hibernate, 3 = Suspend then Hibernate.
hardware_gz302_kde_sleep_mode: 3
