---
- name: Setup dotfiles repository
  ansible.builtin.include_tasks: git_adopt.yml
  vars:
    git_repo: "{{ home_dotfiles_repo }}"
    git_dest: "{{ home_dotfiles_dir }}"

# install.sh is the dotfiles repo's own installer. Re-runnable by design;
# there is no clean change signal, so we mark it unchanged unconditionally.
# Skipped in check mode: the clone above is simulated, so install.sh
# isn't on disk to execute.
- name: Run dotfiles installer
  ansible.builtin.command:
    cmd: "{{ home_dotfiles_dir }}/install.sh"
  changed_when: false
  when: not ansible_check_mode
  become: false

- name: Set git user.name in identity sidecar
  community.general.git_config:
    name: user.name
    value: "{{ hanzo_fullname }}"
    scope: file
    file: "{{ home_gitidentity_file }}"
  when: hanzo_fullname is defined
  become: false

- name: Set git user.email in identity sidecar
  community.general.git_config:
    name: user.email
    value: "{{ hanzo_email }}"
    scope: file
    file: "{{ home_gitidentity_file }}"
  when: hanzo_email is defined
  become: false

- name: Setup claude-config repository
  ansible.builtin.include_tasks: git_adopt.yml
  vars:
    git_repo: "{{ home_claude_config_repo }}"
    git_dest: "{{ home_claude_config_dir }}"

- name: Enable and start user services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: started
    enabled: true
    scope: user
  loop: "{{ home_user_services }}"
  when:
    - not ansible_check_mode
    - host_has_systemd
    - "'XDG_RUNTIME_DIR' in ansible_facts['env']"
  become: false

- name: Ensure cowork workspace exists
  ansible.builtin.file:
    path: "{{ home_cowork_dir }}"
    state: directory
    mode: "0755"
  become: false

# Deployed verbatim: the workspace rules are read by Claude Code as-is,
# so the file carries no managed-by header.
- name: Deploy cowork workspace rules
  ansible.builtin.copy:
    src: cowork/CLAUDE.md
    dest: "{{ home_cowork_dir }}/CLAUDE.md"
    mode: "0644"
  become: false

- name: Configure KDE Plasma user settings
  ansible.builtin.import_tasks: kde.yml
