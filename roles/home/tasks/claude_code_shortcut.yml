---
- name: Ensure ~/cowork exists
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/cowork"
    state: directory
    mode: "0755"
  become: false

- name: Deploy Claude Code launcher .desktop entry
  ansible.builtin.template:
    src: hanzo-claude-code.desktop.j2
    dest: "{{ ansible_facts.env.HOME }}/.local/share/applications/hanzo-claude-code.desktop"
    mode: "0644"
  become: false

# Two-iteration loop because community.general.ini_file writes one
# option per call. kglobalshortcutsrc reload is not wired up: on
# Plasma 6 kglobalacceld is merged into KWin and there is no DBus
# signal to refresh bindings written by external tools — the
# binding activates at the next KDE session start.
- name: Bind Copilot key (F13) to Claude Code launcher in KDE
  community.general.ini_file:
    path: "{{ ansible_facts.env.HOME }}/.config/kglobalshortcutsrc"
    section: hanzo-claude-code.desktop
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    mode: "0644"
  loop:
    - { option: _k_friendly_name, value: Claude Code }
    - { option: _launch, value: "F13,none,Claude Code" }
  become: false
