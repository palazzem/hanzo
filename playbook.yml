---
- name: Provision CachyOS workstation
  hosts: localhost
  connection: local
  become: false
  gather_facts: true
  gather_subset:
    - "!all"
    - min
    - hardware

  vars:
    # Transient sudoers drop-in granting NOPASSWD: /usr/bin/pacman
    # (for paru's nested sudo calls under become: false AUR tasks)
    # and NOPASSWD on the exact rm command the bin/hanzo trap uses
    # to remove this file on interrupt. Installed in the block setup
    # below, removed in `always:` — and again by the shell trap on
    # SIGINT/SIGTERM, which ansible primitives cannot cover.
    hanzo_aur_sudoers: "/etc/sudoers.d/hanzo-aur"

  pre_tasks:
    # Stat-gate systemd-touching tasks on the sd_booted(3) marker
    # /run/systemd/system — absent under `docker build` RUN, chroots,
    # and non-systemd inits. ansible's virtualization_type fact is
    # unreliable here (returns 'NA' under BuildKit despite being inside
    # a docker container), so we don't rely on it.
    - name: Detect running systemd
      ansible.builtin.stat:
        path: /run/systemd/system
      register: hanzo_systemd_stat
      become: false
      tags: [always]

    # `'product_name' in ansible_facts` short-circuits the GZ302 check
    # so it's safe even when the DMI fact is missing (gather_subset
    # without `hardware`, or non-Linux DMI paths).
    - name: Compute provisioning facts
      ansible.builtin.set_fact:
        host_has_systemd: "{{ hanzo_systemd_stat.stat.exists }}"
        model_is_gz302: "{{ 'product_name' in ansible_facts
                           and 'GZ302' in ansible_facts['product_name']
                           and hanzo_systemd_stat.stat.exists }}"
      become: false
      tags: [always]

    # Identity config is optional: load it only when present so first-run
    # and unattended scenarios work without a pre-existing config file.
    # The home role gates git identity injection on `hanzo_fullname is
    # defined`, so a missing config silently skips injection rather than
    # erroring.
    - name: Check for Hanzo user configuration
      ansible.builtin.stat:
        path: "{{ ansible_facts.env.HOME }}/.config/hanzo/config.yml"
      register: hanzo_config_stat
      tags: [always]

    - name: Load Hanzo user configuration if present
      ansible.builtin.include_vars:
        file: "{{ ansible_facts.env.HOME }}/.config/hanzo/config.yml"
      when: hanzo_config_stat.stat.exists
      tags: [always]

  tasks:
    - name: Provision with transient NOPASSWD grant for AUR helper
      block:
        - name: Install transient sudoers drop-in for AUR helper
          ansible.builtin.copy:
            dest: "{{ hanzo_aur_sudoers }}"
            content: |
              {{ ansible_facts['user_id'] }} ALL=(ALL) NOPASSWD: /usr/bin/pacman, /usr/bin/rm {{ hanzo_aur_sudoers }}
            owner: root
            group: root
            mode: "0440"
            validate: "visudo -cf %s"
          become: true
          tags: [always]

        - name: Run hardware role
          ansible.builtin.import_role:
            name: hardware
          tags: [hardware]

        - name: Run system role
          ansible.builtin.import_role:
            name: system
          tags: [system, always]

        - name: Run desktop role
          ansible.builtin.import_role:
            name: desktop
          tags: [desktop]

        - name: Run virtualization role
          ansible.builtin.import_role:
            name: virtualization
          tags: [virtualization]

        - name: Run containers role
          ansible.builtin.import_role:
            name: containers
          tags: [containers]

        - name: Run trust role
          ansible.builtin.import_role:
            name: trust
          tags: [trust, always]

        - name: Run languages role
          ansible.builtin.import_role:
            name: languages
          tags: [languages]

        - name: Run tools role
          ansible.builtin.import_role:
            name: tools
          tags: [tools]

        - name: Run ai role
          ansible.builtin.import_role:
            name: ai
          tags: [ai]

        - name: Run security role
          ansible.builtin.import_role:
            name: security
          tags: [security]

        - name: Run home role
          ansible.builtin.import_role:
            name: home
          tags: [home]

      always:
        - name: Remove transient sudoers drop-in for AUR helper
          ansible.builtin.file:
            path: "{{ hanzo_aur_sudoers }}"
            state: absent
          become: true
          tags: [always]

  # Regenerates the initramfs for every installed kernel and rewrites the
  # Limine boot entries from /etc/default/limine.
  handlers:
    - name: Regenerate initramfs
      ansible.builtin.command: limine-mkinitcpio
      changed_when: true
      become: true
