---
- name: Provision CachyOS workstation
  hosts: localhost
  connection: local
  become: false
  gather_facts: true
  gather_subset:
    - "!all"
    - min
    - hardware
  # Handlers flush at the end of the play, so a failure in a later role would
  # otherwise drop pending notifications that idempotent tasks never re-send.
  force_handlers: true

  pre_tasks:
    # Stat-gate systemd-touching tasks on the sd_booted(3) marker
    # /run/systemd/system — absent under `docker build` RUN, chroots,
    # and non-systemd inits. ansible's virtualization_type fact is
    # unreliable here (returns 'NA' under BuildKit despite being inside
    # a docker container), so we don't rely on it.
    - name: Detect running systemd
      ansible.builtin.stat:
        path: /run/systemd/system
      register: hanzo_systemd_stat
      become: false
      tags: [always]

    # "KDE host" means Plasma is *installed*, not that a session is
    # running: provisioning over SSH/TTY must still write the KDE config
    # that activates at the next login. /usr/bin/plasmashell is the
    # install marker; session-scoped signals (KDE_FULL_SESSION,
    # XDG_CURRENT_DESKTOP) are absent on a headless run and would wrongly
    # skip the binding.
    - name: Detect installed KDE Plasma
      ansible.builtin.stat:
        path: /usr/bin/plasmashell
      register: hanzo_plasma_stat
      become: false
      tags: [always]

    # `'product_name' in ansible_facts` short-circuits the GZ302 check
    # so it's safe even when the DMI fact is missing (gather_subset
    # without `hardware`, or non-Linux DMI paths).
    - name: Compute provisioning facts
      ansible.builtin.set_fact:
        host_has_systemd: "{{ hanzo_systemd_stat.stat.exists }}"
        host_has_kde: "{{ hanzo_plasma_stat.stat.exists }}"
        model_is_gz302: "{{ 'product_name' in ansible_facts
                           and 'GZ302' in ansible_facts['product_name']
                           and hanzo_systemd_stat.stat.exists }}"
      become: false
      tags: [always]

    # Identity config is optional: load it only when present so first-run
    # and unattended scenarios work without a pre-existing config file.
    # The home role gates git identity injection on `hanzo_fullname is
    # defined`, so a missing config silently skips injection rather than
    # erroring.
    - name: Check for Hanzo user configuration
      ansible.builtin.stat:
        path: "{{ ansible_facts.env.HOME }}/.config/hanzo/config.yml"
      register: hanzo_config_stat
      tags: [always]

    - name: Load Hanzo user configuration if present
      ansible.builtin.include_vars:
        file: "{{ ansible_facts.env.HOME }}/.config/hanzo/config.yml"
      when: hanzo_config_stat.stat.exists
      tags: [always]

  # AUR packages are deliberately not installed here: bin/shelly-update
  # reviews and installs the `<role>_aur` manifests via Shelly after
  # this play converges, so the playbook itself needs no NOPASSWD
  # sudoers grant of any kind.
  tasks:
    - name: Run hardware role
      ansible.builtin.import_role:
        name: hardware
      tags: [hardware]

    - name: Run system role
      ansible.builtin.import_role:
        name: system
      tags: [system, always]

    - name: Run desktop role
      ansible.builtin.import_role:
        name: desktop
      tags: [desktop]

    - name: Run virtualization role
      ansible.builtin.import_role:
        name: virtualization
      tags: [virtualization]

    - name: Run containers role
      ansible.builtin.import_role:
        name: containers
      tags: [containers]

    - name: Run languages role
      ansible.builtin.import_role:
        name: languages
      tags: [languages]

    - name: Run tools role
      ansible.builtin.import_role:
        name: tools
      tags: [tools]

    - name: Run ai role
      ansible.builtin.import_role:
        name: ai
      tags: [ai]

    - name: Run security role
      ansible.builtin.import_role:
        name: security
      tags: [security]

    - name: Run home role
      ansible.builtin.import_role:
        name: home
      tags: [home]
