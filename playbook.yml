---
- name: Provision CachyOS workstation
  hosts: localhost
  connection: local
  become: false
  gather_facts: true
  # Restrict fact gathering to the subsets actually consumed by the
  # roles:
  #   - min:      ansible_facts['user_id'], ansible_facts['env']
  #   - hardware: ansible_facts['product_name'] (from /sys/class/dmi/id)
  #   - virtual:  ansible_facts['virtualization_type'] (container guard)
  # Skipping unused subsets (network, ohai, facter) cuts startup time
  # on every run, especially noticeable in the CI container build.
  gather_subset:
    - "!all"
    - min
    - hardware
    - virtual

  vars:
    # Transient sudoers drop-in granting NOPASSWD: /usr/bin/pacman
    # (for paru's nested sudo calls under become: false AUR tasks)
    # and NOPASSWD on the exact rm command the bin/hanzo trap uses
    # to remove this file on interrupt. Installed in the block setup
    # below, removed in `always:` — and again by the shell trap on
    # SIGINT/SIGTERM, which ansible primitives cannot cover.
    hanzo_aur_sudoers: "/etc/sudoers.d/hanzo-aur"

  pre_tasks:
    # Identity config is optional: load it only when present so first-run
    # and unattended scenarios work without a pre-existing config file.
    # The home role gates git identity injection on `hanzo_fullname is
    # defined`, so a missing config silently skips injection rather than
    # erroring.
    - name: Check for Hanzo user configuration
      ansible.builtin.stat:
        path: "{{ ansible_facts.env.HOME }}/.config/hanzo/config.yml"
      register: hanzo_config_stat
      tags: [always]

    - name: Load Hanzo user configuration if present
      ansible.builtin.include_vars:
        file: "{{ ansible_facts.env.HOME }}/.config/hanzo/config.yml"
      when: hanzo_config_stat.stat.exists
      tags: [always]

  tasks:
    - name: Provision with transient NOPASSWD grant for AUR helper
      block:
        - name: Install transient sudoers drop-in for AUR helper
          ansible.builtin.copy:
            dest: "{{ hanzo_aur_sudoers }}"
            content: |
              {{ ansible_facts['user_id'] }} ALL=(ALL) NOPASSWD: /usr/bin/pacman, /usr/bin/rm {{ hanzo_aur_sudoers }}
            owner: root
            group: root
            mode: "0440"
            validate: "visudo -cf %s"
          become: true
          tags: [always]

        # Hardware runs first so the MT7925 wifi-powersave fix is
        # applied before any other role starts downloading. The wifi
        # handler is flushed inside the role; the boot-regen handler
        # fires once at end-of-play.
        - name: Run hardware role
          ansible.builtin.import_role:
            name: hardware
          tags: [hardware]

        - name: Run foundation role
          ansible.builtin.import_role:
            name: foundation
          tags: [foundation, always]

        - name: Run desktop role
          ansible.builtin.import_role:
            name: desktop
          tags: [desktop]

        - name: Run virtualization role
          ansible.builtin.import_role:
            name: virtualization
          tags: [virtualization]

        - name: Run containers role
          ansible.builtin.import_role:
            name: containers
          tags: [containers]

        - name: Run trust role
          ansible.builtin.import_role:
            name: trust
          tags: [trust, always]

        - name: Run languages role
          ansible.builtin.import_role:
            name: languages
          tags: [languages]

        - name: Run tools role
          ansible.builtin.import_role:
            name: tools
          tags: [tools]

        - name: Run ai role
          ansible.builtin.import_role:
            name: ai
          tags: [ai]

        - name: Run security role
          ansible.builtin.import_role:
            name: security
          tags: [security]

        - name: Run home role
          ansible.builtin.import_role:
            name: home
          tags: [home]

      always:
        - name: Remove transient sudoers drop-in for AUR helper
          ansible.builtin.file:
            path: "{{ hanzo_aur_sudoers }}"
            state: absent
          become: true
          tags: [always]
