# AUR packages whose upstream publishes PGP-signed artifacts. For
# these, bin/kaji REQUIRES the pinned fingerprint in validpgpkeys AND
# an actually-executed signature verification — a PKGBUILD update that
# removes or weakens the check aborts the run instead of silently
# downgrading to checksum-only trust.
#
# Format: package fingerprint mode [sigfile datafile]
#   mode "source":   the PKGBUILD ships a detached .sig/.asc source —
#                    `makepkg --verifysource` performs the PGP check;
#                    kaji aborts if no signature source is present.
#   mode "embedded": the signature travels INSIDE the source archive
#                    (makepkg never checks it, and the PKGBUILD's own
#                    gpg call is skipped under Shelly's --skippgpcheck)
#                    — kaji extracts the archive and verifies
#                    <sigfile> against <datafile> with the pinned key
#                    itself.
1password 3FEF9748469ADBE15DA7CA80AC2D62742012EA22 source
1password-cli 3FEF9748469ADBE15DA7CA80AC2D62742012EA22 embedded op.sig op
